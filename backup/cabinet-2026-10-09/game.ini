id           = tempest2000
name         = Tempest 2000
manufacturer = Atari
executable   = tempest2000
version      = 0.1.0
sdk          = 0.1
hiscores     = yes
marquee      = marquee.png

; The spinner or the mouse: how far the claw moves for a turn. At 1.0, 1200
; counts move the claw 5 lanes. 2.0 moves it twice as far, 0.5 half as far; a
; negative value turns the direction round. The menus follow it.
sensitivity    = -1.00

; How loud, each 0 to 100: everything, the tunes, the effects, the voices.
volume         = 16
music_volume   = 100
effects_volume = 45
voice_volume   = 95

; Sound while nobody is playing (title, high scores, demo): yes or no.
attract_sound  = no

; yes: START needs no coin.
free_play      = yes

; The start levels offered from the first day: the original offers every
; second level up to 15, and after that up to where each game has been
; played to. Starting higher is worth a bonus, shown when choosing.
unlocked_level = 47

; A lost life: yes brings back only the enemies not yet shot, and leaves the
; spikes standing, as the first Tempest does. no starts the level's enemies
; from the beginning, as the Tempest 2000 cartridge does. (With two players
; the level always starts from the beginning.)
checkpoints    = yes

; Beastly Mode: the original opens it once level 100 is done. yes opens it
; now. It is started with the Superzapper button when choosing the level.
beastly_mode   = yes

; Your own music: put WAV files (plain PCM, any sample rate) in a folder
; "music" next to this file, named as the tune they replace:
;   tune1.wav  title, high scores, game over
;   tune5.wav  levels  1-16 and 65-80      tune2.wav  levels 17-32 and 81-96
;   tune6.wav  levels 33-48 and 97-100     tune7.wav  levels 49-64
;   (tune3.wav and tune4.wav belong to the bonus levels, which are left out)
; A tune without a file of yours plays the game's own.

; Which control does what, by its advmame.rc name. Without a line of their
; own in advmame.rc these are: p1_button1 Left Ctrl, p1_button2 Left Alt,
; p1_button3 Space, p1_left / p1_right / p1_up / p1_down the arrow keys,
; p2_button1..4 A S Q W, start1 1, start2 2. "none" switches one off.
fire_button    = p1_button1
zap_button     = p1_button3
jump_button    = p1_button2
left_button    = p1_left
right_button   = p1_right

; How many stars the background has, 0 to 256. Every star costs the beam a
; line and a jump, in every frame: fewer make the picture steadier.
stars              = 64

; How bright each kind of thing is drawn, 0 to 100 (below 15 the beam draws
; nothing, so 15 is the least): the web, the stars, the enemies, explosions
; and powerups, the claw and its lane, the shots and the Superzapper's bolt,
; the score line and messages, the lettering of the title and score pages.
brightness_web     = 60
brightness_stars   = 60
brightness_enemies = 85
brightness_effects = 75
brightness_claw    = 100
brightness_shots   = 100
brightness_text    = 70
brightness_title   = 100
digital_sensitivity = 1.00
