id           = tempest2000
name         = Tempest 2000
manufacturer = Atari
executable   = tempest2000
version      = 0.3.1
sdk          = 0.1
hiscores     = yes
description  = Jeff Minter's Tempest 2000, ported to the vector monitor
marquee      = marquee.png

; Everything below can also be set on the machine, in the service menu: F2.
; Its SAVE writes save/settings.ini, and what stands there goes before what
; stands here. (An update of the game replaces this file, not that one.)

; The spinner or the mouse: how far the claw moves for a turn. At 1.0, 1200
; counts move the claw 5 lanes. 2.0 moves it twice as far, 0.5 half as far; a
; negative value turns the direction round. The menus follow it.
sensitivity    = -1.0

; Keys or a joystick: how fast they move the claw. 1.0 is the original's
; speed, 2.0 twice as fast, 0.5 half as fast.
digital_sensitivity = 1.0

; How loud, each 0 to 100: everything, the tunes, the effects, the voices.
; On the cabinet the menu's MUSIC VOLUME and SOUND VOLUME come on top: the
; tunes go by MUSIC VOLUME, effects and voices by SOUND VOLUME.
volume         = 20
music_volume   = 100
effects_volume = 45
voice_volume   = 90

; Sound while nobody is playing (title, high scores, demo): yes or no.
attract_sound  = no

; yes: START needs no coin.
free_play      = no

; The start levels offered from the first day: the original offers every
; second level up to 15, and after that up to where each game has been
; played to. Starting higher is worth a bonus, shown when choosing.
unlocked_level = 15

; A lost life: yes brings back only the enemies not yet shot, and leaves the
; spikes standing, as the first Tempest does. no starts the level's enemies
; from the beginning, as the Tempest 2000 cartridge does. (With two players
; the level always starts from the beginning.)
checkpoints    = yes

; yes offers Tempest 2000 BEASTLY as a game of its own on the game select
; page: Tempest 2000's Beastly Mode (seven enemy shots at once, your shots
; at half speed, flippers never pause, all points doubled), with its own
; start levels and its own high score table (save/highscores_beastly.txt).
beastly_mode   = yes

; How many stars the background has, 0 to 256. Every star costs the beam a
; line and a jump, in every frame: fewer make the picture steadier.
stars              = 64

; How bright each kind of thing is drawn, 0 to 100 (below 15 the beam draws
; nothing, so 15 is the least): the web, the stars, the enemies, explosions
; and powerups, the claw and its lane, the shots and the Superzapper's bolt,
; the score line and messages, the lettering of the title and score pages.
brightness_web     = 60
brightness_stars   = 60
brightness_enemies = 85
brightness_effects = 75
brightness_claw    = 100
brightness_shots   = 100
brightness_text    = 70
brightness_title   = 100

; Your own music: put WAV files (plain PCM, any sample rate) in save/music
; (kept when the game is updated) or in a folder "music" next to this file,
; named as the tune they replace:
;   tune1.wav  title, high scores, game over
;   tune5.wav  levels  1-16 and 65-80      tune2.wav  levels 17-32 and 81-96
;   tune6.wav  levels 33-48 and 97-100     tune7.wav  levels 49-64
;   (tune3.wav and tune4.wav belong to the bonus levels, which are left out)
; A tune without a file of yours plays the game's own.

; Which control does what, read directly (not through advmame.rc):
;   key_Left_Ctrl   a key: key_ and its name, _ for spaces (key_Space, key_K)
;   joy1_button3    a joystick's or yoke's button (joysticks, buttons from 1)
;   joy1_hat1_up    a hat's way (up, down, left, right)
;   joy1_axis2_neg  an axis past half its travel (neg or pos)
;   mouse_left      a mouse button (left, middle, right, x1, x2)
; Several for one function: + between them, up to four. none: no control.
; One control may be on several functions. The service menu (F2) lays them
; out by pressing them. The menus always go by their own controls (arrows,
; any stick, START 1, Enter), whatever is laid out here.
fire_button    = key_Left_Ctrl
zap_button     = key_Left_Alt
jump_button    = key_Space
left_button    = key_Left
right_button   = key_Right
